name: Claude

# Mention @claude in an issue, an issue comment, or a PR review comment and
# Claude will read the repository and reply in the thread.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write        # read the repo, and push a branch if asked to fix
  issues: write          # post replies
  pull-requests: write   # open PRs and comment on them
  id-token: write        # OIDC token used by the action

jobs:
  claude:
    # Only spend an API call when @claude is actually mentioned. Without this
    # guard the job starts on every comment in the repository.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A second mention while the first is still running cancels the first,
    # rather than paying for both.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --model claude-sonnet-5
